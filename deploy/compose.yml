name: qrsadakat

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: qrsadakat-app
    environment:
      BIKIYAK_DEMO_MODE: "0"
      # Four showcase demo places on the map, labelled "Örnek işletme" (28 Sep 2026).
      BIKIYAK_DEMO_PLACES: "1"
      BIKIYAK_PUBLIC_URL: "https://xn--bikyak-r9a.com"
      # Welcome e-mail to new customers, approved by the owner on 28 Sep 2026.
      BIKIYAK_WELCOME_MAIL: "1"
    # GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET; without it Google sign-in stays off (demo still works).
    env_file:
      - path: /root/secrets/qrsadakat-google.env
        required: false
      # RESEND_API_KEY for the welcome e-mail (BIKIYAK_WELCOME_MAIL=1 turns it on after approval).
      - path: /root/secrets/bikiyak-resend.env
        required: false
    restart: unless-stopped
    read_only: true
    user: "10002:10002"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 100
    mem_limit: 256m
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    volumes:
      - qrsadakat_data:/data
    expose:
      - "8088"
    networks:
      - web
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/', timeout=3).read(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  qrsadakat_data:

networks:
  web:
    external: true
