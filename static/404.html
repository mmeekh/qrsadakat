<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#F2F4FA">
  <title>Sayfa bulunamadı · bikıyak</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/brand/icon-32.png">
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell not-found">
    <header class="topbar">
      <a href="/" class="brand" aria-label="bikıyak ana sayfa">
        <svg viewBox="0 0 176 56" role="img" aria-hidden="true">
          <path d="M10 2H166A8 8 0 0 1 174 10V21A7 7 0 0 0 174 35V46A8 8 0 0 1 166 54H10A8 8 0 0 1 2 46V35A7 7 0 0 0 2 21V10A8 8 0 0 1 10 2Z" fill="#FFC933"/>
          <line x1="133" y1="10" x2="133" y2="46" stroke="#0B1433" stroke-opacity=".3" stroke-width="2" stroke-dasharray="3 4"/>
          <text x="15" y="36.5" font-family="Sora, sans-serif" font-weight="800" font-size="22" letter-spacing="-.6" fill="#0B1433">bikıyak</text>
          <path d="M144 30q10 9 20 0" stroke="#0B1433" stroke-width="3.4" fill="none" stroke-linecap="round"/>
        </svg>
      </a>
    </header>
    <main class="view not-found-body">
      <div class="pass not-found-pass">
        <div class="pass-head"><strong>404</strong><span class="chip">Sayfa yok</span></div>
        <h1>Bu sayfa kıyak yapamadı.</h1>
        <p>Aradığın adres yok ya da taşınmış. Bağlantıyı bir QR'dan açtıysan kasadaki güncel QR'ı yeniden okut.</p>
        <div class="card-stamps"><span class="stamp filled">✓</span><span class="stamp filled">✓</span><span class="stamp"></span><span class="stamp"></span><span class="stamp gift">✦</span></div>
      </div>
      <div class="not-found-actions">
        <a class="button primary" href="/">Ana sayfaya dön <span>→</span></a>
        <a class="button secondary" href="/?view=map">Haritada işletmeleri gör</a>
      </div>
    </main>
  </div>
</body>
</html>
